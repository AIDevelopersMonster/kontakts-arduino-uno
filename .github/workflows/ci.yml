name: repository-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate catalog and required files
        run: python tools/validate_repo.py

  arduino-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"
      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
      - name: Compile baseline sketch
        run: >-
          arduino-cli compile
          --warnings all
          --fqbn arduino:avr:uno
          projects/001-blink-baseline/firmware/arduino-ide/blink_baseline

  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.19
      - name: Compile PlatformIO baseline
        working-directory: projects/001-blink-baseline/firmware/platformio
        run: pio run
